<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sasclops</title>
  <meta name="description" content="sasclops — radar placeholder">
  <meta name="theme-color" content="#0b0704">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230b0704'/%3E%3Crect y='7' width='16' height='2' fill='%23ff8200'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap">
  <style>
    :root {
      --bg: #0b0704;
      --accent: 255 130 0;
      --panel: rgb(10 6 3 / 0.94);
    }
    .room {
      --bg: #04070b;
      --accent: 40 150 255;
      --panel: rgb(3 6 10 / 0.94);
    }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
    }

    /* Logo, with the eye as a hidden way into the terminal. */
    .logo {
      position: fixed;
      top: 50%;
      left: 50%;
      translate: -50% -50%;
      width: min(72vw, 640px, 103dvh);   /* 103dvh keeps it under 70dvh tall */
      pointer-events: none;
    }
    .logo img {
      display: block;
      width: 100%;
      height: auto;
      opacity: 0;   /* drawn on the canvas by radar.js; kept for layout, alt text and the eye */
    }
    .eye {
      position: absolute;
      left: 48.4%;
      top: 38.5%;
      width: 13%;
      aspect-ratio: 1;
      translate: -50% -50%;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: none;
      cursor: pointer;
      pointer-events: auto;
    }
    .eye:focus-visible { outline: 2px solid rgb(var(--accent)); outline-offset: 2px; }
    .room .logo { display: none; }

    /* Terminal: slides up from the bottom. */
    .term {
      position: fixed;
      inset: auto 0 0 0;
      box-sizing: border-box;
      width: 100%;
      max-width: none;
      height: min(55dvh, 440px);
      max-height: none;
      margin: 0;
      padding: 12px 16px;
      border: 0;
      border-top: 1px solid rgb(var(--accent) / 0.6);
      background: var(--panel);
      box-shadow: 0 0 24px rgb(var(--accent) / 0.25);
      color: rgb(var(--accent));
      font: 15px/1.5 'JetBrains Mono', ui-monospace, monospace;
      text-shadow: 0 0 4px rgb(var(--accent) / 0.5);
      flex-direction: column;
      translate: 0 100%;
      transition: translate 0.25s ease-out, overlay 0.25s allow-discrete, display 0.25s allow-discrete;
    }
    .term[open] { display: flex; translate: 0 0; }
    @starting-style { .term[open] { translate: 0 100%; } }
    .term::backdrop { background: transparent; }
    .term-out {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      scrollbar-width: thin;
      scrollbar-color: rgb(var(--accent) / 0.5) transparent;
    }
    .term-out > :first-child { margin-top: auto; }   /* stack output down against the prompt */
    .term-out .echo { opacity: 0.75; }
    .term-out .err { color: rgb(255 90 70); }
    .room .term-out .err { color: rgb(255 120 160); }
    .term-line { display: flex; gap: 0.5ch; }
    .term-in {
      flex: 1;
      min-width: 0;
      padding: 0;
      border: 0;
      outline: none;
      background: none;
      color: inherit;
      font: inherit;
      text-shadow: inherit;
      caret-color: rgb(var(--accent));
      caret-shape: block;
    }

    /* rm -rf / */
    @keyframes glitch {
      0%   { filter: none; translate: 0 0; }
      15%  { filter: hue-rotate(90deg) saturate(3); translate: -6px 2px; }
      30%  { filter: invert(1); translate: 5px -3px; }
      45%  { filter: hue-rotate(-120deg) contrast(2); translate: -3px 0; }
      60%  { filter: invert(1) blur(1px); translate: 4px 3px; }
      80%  { filter: saturate(0); translate: 0 -2px; }
      100% { filter: none; translate: 0 0; }
    }
    .glitch canvas, .glitch .term { animation: glitch 0.9s steps(1); }

    @media (prefers-reduced-motion: reduce) {
      .term { transition: none; }
      .glitch canvas, .glitch .term { animation: none; }
    }
  </style>
</head>
<body>
  <canvas id="radar" aria-hidden="true"></canvas>
  <div class="logo">
    <img src="sasclops.png" alt="SASCLOPS — claritas ex datis, datum ex obscuris">
    <button class="eye" type="button" aria-label="Open terminal"></button>
  </div>
  <dialog class="term" aria-label="Terminal" closedby="any">
    <div class="term-out" role="log"></div>
    <form class="term-line">
      <label class="prompt" for="term-in">visitor@sasclops:~$</label>
      <input class="term-in" id="term-in" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go">
    </form>
  </dialog>
  <script src="radar.js"></script>
  <script src="terminal.js"></script>
  <script src="salvo.js"></script>
  <!-- cfg: LyNmYzVlMTI4ZDc4OGE= -->
</body>
</html>
